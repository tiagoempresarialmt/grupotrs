<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analise Gold!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #fff; }
        .chart-container { display: flex; flex-direction: column; gap: 10px; padding: 10px; }
        .chart-wrapper { width: 100%; }
    </style>
</head>
<body>
    <div class="chart-container">
        <div class="chart-wrapper">
            <!-- TradingView Widget BEGIN -->
            <div class="tradingview-widget-container" style="height:500px;width:100%">
                <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                {
                "allow_symbol_change": true,
                "calendar": false,
                "details": false,
                "hide_side_toolbar": true,
                "hide_top_toolbar": false,
                "hide_legend": false,
                "hide_volume": false,
                "hotlist": false,
                "interval": "3",
                "locale": "br",
                "save_image": true,
                "style": "1",
                "symbol": "FOREXCOM:XAUUSD",
                "theme": "light",
                "timezone": "Etc/UTC",
                "backgroundColor": "#ffffff",
                "gridColor": "rgba(46, 46, 46, 0.06)",
                "watchlist": [],
                "withdateranges": false,
                "compareSymbols": [],
                "studies": [
                    "STD;EMA"
                ],
                "autosize": true,
                "height": 400
                }
                </script>
            </div>
            <!-- TradingView Widget END -->
        </div>
        <div class="chart-wrapper">
            <!-- TradingView Widget BEGIN -->
            <div class="tradingview-widget-container" style="height:500px;width:100%">
                <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                {
                "allow_symbol_change": true,
                "calendar": false,
                "details": false,
                "hide_side_toolbar": true,
                "hide_top_toolbar": false,
                "hide_legend": false,
                "hide_volume": false,
                "hotlist": false,
                "interval": "5",
                "locale": "br",
                "save_image": true,
                "style": "1",
                "symbol": "FOREXCOM:XAUUSD",
                "theme": "light",
                "timezone": "Etc/UTC",
                "backgroundColor": "#ffffff",
                "gridColor": "rgba(46, 46, 46, 0.06)",
                "watchlist": [],
                "withdateranges": false,
                "compareSymbols": [],
                "studies": [
                    "STD;EMA"
                ],
                "autosize": true,
                "height": 400
                }
                </script>
            </div>
            <!-- TradingView Widget END -->
        </div>
    </div>

    <!-- Popup Horário de Lives -->
    <div class="modal" id="modalLive" role="dialog" aria-modal="true" aria-labelledby="popupLiveTitle">
        <div class="modal-backdrop" onclick="fecharPopupLive()"></div>
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="popupLiveTitle">Horário de Lives</h3>
                <button class="modal-close" onclick="fecharPopupLive()">&times;</button>
            </div>
            <div class="modal-body">
                <p><strong>Segunda a Sexta-feira</strong></p>
                <p><strong>das 09:00 às 17:00</strong></p>
                <p style="font-size:0.9rem; color:#94a3b8; margin-top:1rem;">Acompanhe nossas lives diárias com análises de mercado.</p>
            </div>
        </div>
    </div>

    <script>
        function abrirPopupLive() {
            document.getElementById('modalLive').classList.add('active');
        }
        function fecharPopupLive() {
            document.getElementById('modalLive').classList.remove('active');
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') fecharPopupLive();
        });
    </script>
</body>
</html>
